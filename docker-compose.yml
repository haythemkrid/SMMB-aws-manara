services:
  auth:
    build: { context: ., dockerfile: services/auth/Dockerfile }
    environment: [PORT=4000, JWT_SECRET=local-compose-secret]
    ports: ['4000:4000']
  notifications:
    build: { context: ., dockerfile: services/notifications/Dockerfile }
    environment: [PORT=4002]
    ports: ['4002:4002']
  requests:
    build: { context: ., dockerfile: services/requests/Dockerfile }
    environment: [PORT=4001, NOTIFICATIONS_URL=http://notifications:4002]
    depends_on: [notifications]
    ports: ['4001:4001']